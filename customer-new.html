<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1769e0">
  <title>顧客登録｜AKEHARu CRM</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f6fa;
      color: #17233b;
    }

    .header {
      background: #1769e0;
      color: white;
      padding: 28px 22px 24px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header p {
      margin: 6px 0 0;
      opacity: 0.9;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 22px 18px 50px;
    }

    .back {
      display: inline-block;
      margin-bottom: 18px;
      color: #1769e0;
      text-decoration: none;
      font-weight: bold;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.05);
    }

    .card h2 {
      margin: 0 0 20px;
      font-size: 24px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5dce6;
      border-radius: 12px;
      font-size: 16px;
      background: white;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #1769e0;
    }

    .required {
      color: #e53935;
      font-size: 13px;
      margin-left: 5px;
    }

    .save {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      background: #1769e0;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .save:active {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>AKEHARu CRM</h1>
    <p>顧客登録</p>
  </header>

  <main class="container">

    <a class="back" href="index.html">← ホームへ戻る</a>

    <div class="card">
      <h2>新規顧客登録</h2>

      <form id="customerForm">

        <div class="field">
          <label>
            顧客名
            <span class="required">必須</span>
          </label>
          <input
            type="text"
            id="name"
            placeholder="例：山田 太郎"
            required
          >
        </div>

        <div class="field">
          <label>フリガナ</label>
          <input
            type="text"
            id="kana"
            placeholder="例：ヤマダ タロウ"
          >
        </div>

        <div class="field">
          <label>電話番号</label>
          <input
            type="tel"
            id="phone"
            placeholder="例：090-1234-5678"
          >
        </div>

        <div class="field">
          <label>郵便番号</label>
          <input
            type="text"
            id="postal"
            placeholder="例：123-4567"
          >
        </div>

        <div class="field">
          <label>住所</label>
          <input
            type="text"
            id="address"
            placeholder="東京都〇〇区〇〇..."
          >
        </div>

        <div class="field">
          <label>エアコンメーカー</label>
          <input
            type="text"
            id="manufacturer"
            placeholder="例：ダイキン"
          >
        </div>

        <div class="field">
          <label>エアコン型番</label>
          <input
            type="text"
            id="model"
            placeholder="例：AN40ZRP-W"
          >
        </div>

        <div class="field">
          <label>設置場所</label>
          <input
            type="text"
            id="location"
            placeholder="例：リビング"
          >
        </div>

        <div class="field">
          <label>メモ</label>
          <textarea
            id="memo"
            placeholder="故障内容・訪問時の注意事項など"
          ></textarea>
        </div>

        <button class="save" type="submit">
          顧客を登録
        </button>

      </form>
    </div>
  </main>

  <script>
    document.getElementById('customerForm').addEventListener('submit', function(e) {
      e.preventDefault();

      alert('入力画面の動作確認OKです。次の工程でデータ保存機能を接続します。');
    });
  </script>

</body>
</html>
